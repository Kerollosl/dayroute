<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>dayroute</title>
<meta name="description" content="A day of stops read as a rail line, routed for least driving, handed to Google Maps.">
<meta name="theme-color" content="#E6E1D4">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23E6E1D4'/%3E%3Cpath d='M6 24 L14 8 L18 16 L26 16' fill='none' stroke='%230E7A46' stroke-width='3.5' stroke-linecap='square'/%3E%3Ccircle cx='14' cy='8' r='3' fill='%23141814'/%3E%3Ccircle cx='26' cy='16' r='3' fill='%23141814'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
<!--
THESIS: A day of driving read as a rail line, not a list. Refuses the itinerary-cards-beside-a-map-panel
arrangement every trip planner ships; here the schedule IS the diagram.
OWN-WORLD: Printed on oat paper #E6E1D4, cards raised to white so an event is legibly distinct from empty
grid — the previous dark ground put those two within 1.12:1 of each other and they genuinely could not be
told apart. Green #0E7A46 is the route ink, the primary action, and a flexible station; ink #141814 fills a
fixed appointment's interchange; clay #B0431F is the complement and the sole attention ink — won't-fit and
collision, nothing routine. The Line is drawn in weighted segments, heavy at a stop, medium while driving,
dashed across slack, so its thickness carries meaning instead of a dot in a gap. Archivo, wide-tracked caps
labels, tabular figures right-aligned. The basemap is recoloured by luminance onto the same paper.
STORY: The visitor sees the whole day as one line, reads where the driving actually costs, optimises
around the appointments they cannot move, and leaves with a Maps link already loaded.
FIRST VIEWPORT: Left rail, brand over day totals as large tabular figures, Optimise beneath. Centre, the
Line: a vertical time axis where stations sit at their real times so the gap between two stops IS the
drive leg, split into its driven and slack parts. Right, the map on the same paper, route in green.
FORM: Transit diagram, light stock. Palette replaced at the user's direction; the dark original lost to a
daylight use scene — this is read on a phone, in a car, in the sun.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict,
DESIGN.md, and every shipping raster carrying its provenance.
-->
<div class="app" id="app">

  <aside class="rail" id="rail">
    <header class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M9 22 L16 10 L23 22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"/>
      </svg>
      <div class="brand-text">
        <span class="brand-name">dayroute</span>
        <span class="brand-sub">one line, least driving</span>
      </div>
    </header>

    <nav class="daynav" aria-label="Day">
      <button class="daynav-btn" id="dayPrev" aria-label="Previous day">&#8249;</button>
      <button class="daynav-date" id="dayLabel" aria-live="polite">—</button>
      <button class="daynav-btn" id="dayNext" aria-label="Next day">&#8250;</button>
    </nav>
    <button class="daynav-today" id="dayToday">Today</button>

    <section class="totals" aria-label="Day totals">
      <div class="total total--lead">
        <span class="total-figure" id="totDrive">0:00</span>
        <span class="total-label">Driving</span>
      </div>
      <div class="total-row">
        <div class="total">
          <span class="total-figure total-figure--sm" id="totDist">0</span>
          <span class="total-label">Miles</span>
        </div>
        <div class="total">
          <span class="total-figure total-figure--sm" id="totStops">0</span>
          <span class="total-label">Stops</span>
        </div>
      </div>
      <div class="delta" id="delta" hidden>
        <span class="delta-figure" id="deltaFigure">0:00</span>
        <span class="delta-label" id="deltaLabel">saved</span>
      </div>
    </section>

    <div class="rail-actions">
      <button class="btn btn--primary" id="btnOptimize">
        <span>Optimise</span>
        <svg viewBox="0 0 16 16" aria-hidden="true" class="btn-ico"><path d="M2 8h9M8 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <button class="btn btn--ghost" id="btnUndo" disabled>Undo</button>
    </div>

    <div class="rail-actions">
      <button class="btn btn--line btn--wide" id="btnMapsAction">
        <span id="btnMapsActionLabel">Copy Maps link</span>
      </button>
    </div>
    <p class="rail-note" id="mapsNote" hidden></p>

    <footer class="rail-foot">
      <span class="status" id="netStatus"><i class="status-dot"></i><span id="netStatusText">Ready</span></span>
    </footer>
  </aside>

  <main class="line-pane">
    <div class="pane-head">
      <h2 class="pane-title">The Line</h2>
      <div class="legend" id="legend"></div>
    </div>
    <div class="line-body">
      <div class="line-grid" id="calendar"></div>
      <svg class="line-overlay" id="lineOverlay" aria-hidden="true"></svg>
    </div>
  </main>

  <section class="tray" id="tray" aria-label="Unscheduled stops">
    <div class="pane-head">
      <h2 class="pane-title">Sidings</h2>
      <span class="pane-count" id="trayCount">0</span>
    </div>
    <div class="search">
      <input type="text" id="searchInput" placeholder="Find a place or paste an address" autocomplete="off" spellcheck="false">
      <div class="search-results" id="searchResults" hidden></div>
    </div>
    <div class="tray-list" id="trayList"></div>
    <button class="btn btn--ghost btn--wide" id="btnPaste">Paste a list</button>
  </section>

  <section class="map-pane">
    <div id="map" class="map"></div>
    <div class="map-scrim" id="mapScrim" hidden><span>Recolouring basemap…</span></div>
  </section>

</div>

<dialog class="sheet" id="pasteSheet">
  <form method="dialog" class="sheet-inner">
    <h3 class="sheet-title">Paste a list</h3>
    <p class="sheet-help">One stop per line. <code>Name, Address</code> or just an address. CSV headers are detected.</p>
    <textarea id="pasteBox" rows="12" spellcheck="false" placeholder="Rays Hell Burger, 1725 Wilson Blvd, Arlington VA&#10;Great Falls Park&#10;2001 Jefferson Davis Hwy, Arlington VA"></textarea>
    <div class="sheet-actions">
      <button class="btn btn--ghost" value="cancel">Cancel</button>
      <button class="btn btn--primary" id="pasteConfirm" value="ok">Add to sidings</button>
    </div>
  </form>
</dialog>

<dialog class="sheet" id="stopSheet">
  <form method="dialog" class="sheet-inner">
    <h3 class="sheet-title" id="stopSheetTitle">Stop</h3>
    <label class="field"><span>Name</span><input type="text" id="stopName" autocomplete="off"></label>
    <label class="field"><span>Address</span><input type="text" id="stopAddr" autocomplete="off"></label>
    <div class="field-row">
      <label class="field"><span>Dwell (min)</span><input type="number" id="stopDwell" min="0" step="5" value="30"></label>
      <label class="field field--check"><input type="checkbox" id="stopPinned"><span>Fixed time</span></label>
    </div>
    <p class="field-note" id="stopGeoNote"></p>
    <div class="sheet-actions">
      <button class="btn btn--ghost" value="cancel">Cancel</button>
      <button class="btn btn--danger" id="stopDelete" type="button">Delete</button>
      <button class="btn btn--primary" value="ok">Save</button>
    </div>
  </form>
</dialog>

<div class="toast-stack" id="toasts" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
